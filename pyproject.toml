[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cairnmark"
version = "1.0.0"
description = "Official Python client for the CairnMark file service"
readme = "README.md"
license = "MIT"
authors = [{ name = "Michael Ramirez" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/mettjs/cairnmark-python"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "pyright>=1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cairnmark"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
markers = ["integration: requires a live CairnMark server"]
addopts = "-m 'not integration'"
asyncio_mode = "auto"
